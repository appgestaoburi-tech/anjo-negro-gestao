name: Preparar e compilar Anjo Negro Gestão

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Criar estrutura Flutter
        run: |
          flutter create --org com.anjonegro --project-name gestao .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Criar estrutura inicial Flutter" || true
          git push

      - name: Baixar dependências
        run: flutter pub get

      - name: Gerar APK
        run: flutter build apk --release

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: anjo-negro-gestao-apk
          path: build/app/outputs/flutter-apk/app-release.apk
